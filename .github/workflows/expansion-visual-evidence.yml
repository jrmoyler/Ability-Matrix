name: Expansion visual evidence
on:
  pull_request:
    paths:
      - 'packs/sandbox/**'
      - 'tools/expansion-visual-evidence.mjs'
      - '.github/workflows/expansion-visual-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund --prefix packs/sandbox
      - run: npm install --no-save --no-package-lock playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: node tools/expansion-visual-evidence.mjs
      - name: Upload captures and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: expansion-visual-evidence
          path: evidence/expansion-ci/
          if-no-files-found: warn
          retention-days: 14
  mechanics:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund --prefix packs/sandbox
      - run: npm install --no-save --no-package-lock playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - name: Remove historical captures before testing
        run: rm -rf evidence/mechanics
      - run: node tools/mechanics-smoke.mjs
      - name: Upload current mechanics captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mechanics-visual-evidence
          path: evidence/mechanics/
          if-no-files-found: warn
          retention-days: 14
